<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fresh SIM Tracker — CNIC & Mobile Lookup</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
    background: linear-gradient(135deg, #1e3a8a 0%, #4c1d95 100%);
    min-height: 100vh;
    color: #1f2937;
    padding: 24px;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    overflow: hidden;
  }
  .header {
    background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
    color: white;
    padding: 32px;
    text-align: center;
    position: relative;
  }
  .header h1 { margin: 0 0 8px; font-size: 1.8rem; }
  .header p { margin: 0; opacity: 0.9; font-size: 0.95rem; }
  .header-actions {
    position: absolute;
    top: 20px;
    right: 20px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .header-btn {
    padding: 8px 14px;
    background: rgba(255,255,255,0.15);
    color: white;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.2s;
  }
  .header-btn:hover { background: rgba(255,255,255,0.25); }

  .form-wrap { padding: 28px 32px 8px; }
  .form-row { display: flex; gap: 12px; flex-wrap: wrap; }
  input[type="text"] {
    flex: 1;
    min-width: 240px;
    padding: 14px 16px;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    font-size: 1rem;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }
  input[type="text"]:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
  }
  button[type="submit"] {
    padding: 14px 28px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
  }
  button[type="submit"]:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
  }
  button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }

  .hint { padding: 8px 32px 0; font-size: 0.82rem; color: #6b7280; }
  .status { padding: 16px 32px 0; font-size: 0.9rem; }
  .status.error { color: #b91c1c; }
  .status.info  { color: #1d4ed8; }

  .quota {
    margin: 12px 32px 0;
    padding: 8px 14px;
    background: #eef2ff;
    color: #3730a3;
    border-radius: 8px;
    font-size: 0.85rem;
    display: inline-block;
  }
  .quota.low { background: #fef2f2; color: #991b1b; }

  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    margin-left: 8px;
    vertical-align: middle;
  }
  .badge-cnic   { background: #dbeafe; color: #1e40af; }
  .badge-mobile { background: #dcfce7; color: #166534; }
  .badge-auto   { background: #fef3c7; color: #92400e; }

  .auto-note {
    margin: 12px 32px 0;
    padding: 10px 14px;
    border-left: 4px solid #f59e0b;
    background: #fffbeb;
    color: #78350f;
    font-size: 0.9rem;
    border-radius: 6px;
  }

  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: -3px;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .results { padding: 20px 32px 32px; }

  .results-toolbar {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .btn-secondary {
    background: #ffffff;
    color: #1e40af;
    border: 2px solid #1e40af;
    padding: 10px 18px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s, transform 0.15s;
  }
  .btn-secondary:hover { background: #eef2ff; transform: translateY(-1px); }
  .btn-secondary svg { width: 16px; height: 16px; }

  .card {
    border: 1px solid #e5e7eb;
    border-left: 4px solid #7c3aed;
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 14px;
    background: #fafafa;
    transition: box-shadow 0.2s;
    break-inside: avoid;
    page-break-inside: avoid;
  }
  .card:hover { box-shadow: 0 6px 18px rgba(0,0,0,0.08); }
  .card.primary { border-left-color: #059669; background: #f0fdf4; }
  .row {
    display: flex;
    padding: 6px 0;
    border-bottom: 1px dashed #eee;
    font-size: 0.95rem;
  }
  .row:last-child { border-bottom: none; }
  .label { width: 110px; font-weight: 600; color: #4b5563; flex-shrink: 0; }
  .value {
    color: #111827;
    word-break: break-word;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }
  .network-logo { height: 24px; width: auto; border-radius: 3px; vertical-align: middle; }

  @media (max-width: 600px) {
    .header { padding: 22px; }
    .header h1 { font-size: 1.4rem; }
    .header-actions { top: 12px; right: 12px; padding: 0; }
    .header-btn { padding: 6px 10px; font-size: 0.72rem; }
    .form-wrap, .results, .status, .hint, .auto-note, .quota {
      padding-left: 18px; padding-right: 18px;
    }
    .auto-note, .quota { margin-left: 18px; margin-right: 18px; }
    .label { width: 90px; font-size: 0.9rem; }
  }

  @media print {
    @page { size: A4; margin: 14mm 12mm; }
    html, body {
      background: #ffffff !important;
      padding: 0 !important;
      margin: 0 !important;
      color: #000;
      -webkit-print-color-adjust: exact;
              print-color-adjust: exact;
    }
    .container {
      box-shadow: none !important;
      border-radius: 0 !important;
      max-width: 100% !important;
      margin: 0 !important;
    }
    .header {
      background: #1e40af !important;
      color: #ffffff !important;
      padding: 16px !important;
    }
    .header-actions { display: none !important; }
    .header h1 { font-size: 1.3rem; margin: 0 0 4px; }
    .header p  { font-size: 0.8rem; }

    .form-wrap, .hint, .status, .quota, #autoNote, .results-toolbar {
      display: none !important;
    }
    .results { padding: 12px 0 0 !important; }
    .card {
      border: 1px solid #cccccc;
      background: #fafafa !important;
      padding: 12px 14px;
      margin-bottom: 10px;
      box-shadow: none !important;
    }
    .card.primary { background: #f0fdf4 !important; }
    .row { font-size: 12px; padding: 4px 0; }
    .label { width: 90px; font-size: 12px; }
    .value { font-size: 12px; }
    .network-logo { height: 18px; }
    .badge { font-size: 10px; padding: 1px 6px; }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-actions">
        <a href="/admin" id="adminLink" class="header-btn" style="display:none;">⚙️ Admin</a>
        <button class="header-btn" id="changePwBtn" type="button">🔑 Password</button>
        <button class="header-btn" id="logoutBtn" type="button">Logout</button>
      </div>
      <h1>📱 Fresh SIM Tracker</h1>
      <p>Search SIM details by CNIC or Mobile number</p>
    </div>

    <div class="form-wrap">
      <form id="searchForm" class="form-row">
        <input
          type="text"
          id="query"
          name="query"
          placeholder="Enter CNIC (13 digits) or Mobile (11 digits)"
          maxlength="20"
          autocomplete="off"
          required
        />
        <button type="submit" id="submitBtn">Search</button>
      </form>
    </div>
    <div class="hint">
      Examples: <strong>4530448083059</strong> (CNIC) &nbsp;•&nbsp;
      <strong>03001234567</strong> or <strong>+923001234567</strong> (Mobile)
    </div>

    <div id="quotaBox" class="quota" style="display:none;"></div>
    <div id="status" class="status"></div>
    <div id="autoNote"></div>

    <div class="results" id="resultsWrap">
      <div id="resultsToolbar" class="results-toolbar" style="display:none;">
        <button type="button" id="downloadPdfBtn" class="btn-secondary" title="Save results as PDF">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Save as PDF
        </button>
      </div>
      <div id="results"></div>
    </div>
  </div>

<script>
  // -------------------------------------------------------------------------
  //  JS Fingerprint
  // -------------------------------------------------------------------------
  function computeFingerprint() {
    const parts = [];
    parts.push(`scr:${screen.width}x${screen.height}x${screen.colorDepth}`);
    parts.push(`dpr:${window.devicePixelRatio || 1}`);
    parts.push(`tz:${Intl.DateTimeFormat().resolvedOptions().timeZone || "?"}`);
    parts.push(`lang:${navigator.language || "?"}`);
    parts.push(`langs:${(navigator.languages || []).join(",")}`);
    parts.push(`cores:${navigator.hardwareConcurrency || "?"}`);
    parts.push(`mem:${navigator.deviceMemory || "?"}`);
    parts.push(`touch:${(navigator.maxTouchPoints || 0)}`);
    parts.push(`plat:${navigator.platform || "?"}`);

    try {
      const c = document.createElement("canvas");
      c.width = 220; c.height = 40;
      const ctx = c.getContext("2d");
      if (ctx) {
        ctx.textBaseline = "top";
        ctx.font = "16px 'Arial'";
        ctx.fillStyle = "#f60"; ctx.fillRect(0, 0, 220, 40);
        ctx.fillStyle = "#069"; ctx.fillText("Fingerprint!", 4, 8);
        ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
        ctx.fillText("Fingerprint!", 6, 20);
        parts.push(`canvas:${c.toDataURL().slice(-64)}`);
      }
    } catch { parts.push("canvas:err"); }

    try {
      const c = document.createElement("canvas");
      const gl = c.getContext("webgl") || c.getContext("experimental-webgl");
      if (gl) {
        const dbg = gl.getExtension("WEBGL_debug_renderer_info");
        if (dbg) {
          parts.push(`gpu:${gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL)}|${gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)}`);
        } else {
          parts.push(`gpu:${gl.getParameter(gl.VENDOR)}|${gl.getParameter(gl.RENDERER)}`);
        }
      }
    } catch { parts.push("gpu:err"); }

    let h = 0x811c9dc5;
    const str = parts.join("||");
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = (h * 0x01000193) >>> 0;
    }
    return "fp_" + h.toString(16).padStart(8, "0") + "_" + str.length.toString(16);
  }

  const FINGERPRINT = computeFingerprint();

  // -------------------------------------------------------------------------
  //  DOM
  // -------------------------------------------------------------------------
  const form        = document.getElementById("searchForm");
  const input       = document.getElementById("query");
  const btn         = document.getElementById("submitBtn");
  const statusEl    = document.getElementById("status");
  const autoNote    = document.getElementById("autoNote");
  const resultsEl   = document.getElementById("results");
  const quotaBox    = document.getElementById("quotaBox");
  const toolbar     = document.getElementById("resultsToolbar");
  const downloadBtn = document.getElementById("downloadPdfBtn");
  const logoutBtn   = document.getElementById("logoutBtn");
  const changePwBtn = document.getElementById("changePwBtn");
  const adminLink   = document.getElementById("adminLink");

  function setStatus(html, type = "") {
    statusEl.className = "status " + type;
    statusEl.innerHTML = html;
  }
  function clearAutoNote() { autoNote.innerHTML = ""; }
  function setAutoNote(html) {
    autoNote.innerHTML = `<div class="auto-note">${html}</div>`;
  }
  function escapeHtml(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }
  function showToolbar(show) {
    toolbar.style.display = show ? "flex" : "none";
  }

  function humanizeReset(seconds) {
    if (!seconds || seconds <= 0) return "soon";
    const mins = Math.ceil(seconds / 60);
    if (mins < 60) return `${mins} min`;
    const hours = Math.floor(mins / 60);
    const remMin = mins % 60;
    return remMin ? `${hours}h ${remMin}m` : `${hours}h`;
  }

  function setQuota(q) {
    if (!q) { quotaBox.style.display = "none"; return; }
    quotaBox.style.display = "inline-block";
    quotaBox.classList.toggle("low", q.remaining <= 2);
    quotaBox.textContent =
      `Searches remaining: ${q.remaining} / ${q.limit}` +
      (q.reset_in > 0 ? ` (resets in ~${humanizeReset(q.reset_in)})` : "");
  }

  function detectType(raw) {
    const digits = raw.replace(/\D/g, "");
    let stripped = digits;
    if (stripped.startsWith("0092")) stripped = stripped.slice(4);
    else if (stripped.startsWith("92") && stripped.length === 12) stripped = stripped.slice(2);

    if (digits.length === 13 && !digits.startsWith("0")) return "cnic";
    if (stripped.length === 11 && stripped.startsWith("03")) return "mobile";
    if (stripped.length === 10 && stripped.startsWith("3"))  return "mobile";
    return "invalid";
  }

  let CURRENT_QUERY = "";

  function renderResults(list, searchedMobile, queryForPdf) {
    if (!list.length) { resultsEl.innerHTML = ""; showToolbar(false); return; }
    const normalize = s => String(s || "").replace(/\D/g, "");
    const searched = normalize(searchedMobile);

    CURRENT_QUERY = queryForPdf || "";

    const printHeader = `
      <div class="print-only" style="display:none;">
        <h2 style="margin:0 0 4px;font-size:16px;">Fresh SIM Tracker — Search Report</h2>
        <p style="margin:0 0 12px;font-size:12px;color:#555;">
          Query: <strong>${escapeHtml(CURRENT_QUERY)}</strong> &nbsp;•&nbsp;
          Generated: ${new Date().toLocaleString()}
        </p>
      </div>
    `;

    resultsEl.innerHTML = printHeader + list.map((r, i) => {
      const isPrimary = searched && normalize(r.mobile) === searched;

      let networkCell = "";
      if (r.network_image) {
        networkCell += `<img class="network-logo"
                            src="${escapeHtml(r.network_image)}"
                            alt="${escapeHtml(r.network || 'network')}"
                            onerror="this.style.display='none'" />`;
      }
      if (r.network && String(r.network).trim()) {
        networkCell += `<span>${escapeHtml(r.network)}</span>`;
      } else if (!r.network_image) {
        networkCell = "<span>—</span>";
      }

      return `
        <div class="card${isPrimary ? " primary" : ""}">
          <div class="row"><div class="label">#</div><div class="value">${i + 1}${isPrimary ? ' <span class="badge badge-auto">MATCH</span>' : ""}</div></div>
          <div class="row"><div class="label">Mobile</div><div class="value">${escapeHtml(r.mobile || "—")}</div></div>
          <div class="row"><div class="label">Name</div><div class="value">${escapeHtml(r.name || "—")}</div></div>
          <div class="row"><div class="label">CNIC</div><div class="value">${escapeHtml(r.cnic || "—")}</div></div>
          <div class="row"><div class="label">Address</div><div class="value">${escapeHtml(r.address || "—")}</div></div>
          <div class="row"><div class="label">Network</div><div class="value">${networkCell}</div></div>
        </div>
      `;
    }).join("");

    showToolbar(true);
  }

  // -------------------------------------------------------------------------
  //  Quota fetch
  // -------------------------------------------------------------------------
  async function refreshQuota() {
    try {
      const r = await fetch("/api/quota", {
        method: "GET",
        credentials: "include",
        headers: { "X-Fingerprint": FINGERPRINT }
      });
      if (!r.ok) return;
      const q = await r.json();
      if (q.success) setQuota(q);
    } catch { /* ignore */ }
  }

  refreshQuota();

  // -------------------------------------------------------------------------
  //  Check session — show admin link if admin, else redirect if 401
  // -------------------------------------------------------------------------
  (async function checkSession() {
    try {
      const r = await fetch("/api/session", { credentials: "include" });
      if (r.status === 401) {
        window.location.href = "/login";
        return;
      }
      const d = await r.json();
      if (d.success && d.is_admin) {
        adminLink.style.display = "inline-block";
      }
    } catch { /* ignore */ }
  })();

  // -------------------------------------------------------------------------
  //  Logout
  // -------------------------------------------------------------------------
  logoutBtn.addEventListener("click", async () => {
    try {
      await fetch("/api/logout", { method: "POST", credentials: "include" });
    } catch { /* ignore */ }
    window.location.href = "/login";
  });

  // -------------------------------------------------------------------------
  //  Change own password
  // -------------------------------------------------------------------------
  changePwBtn.addEventListener("click", async () => {
    const oldPw = prompt("Enter your CURRENT password:");
    if (!oldPw) return;
    const newPw = prompt("Enter your NEW password (min 6 chars):");
    if (!newPw) return;
    if (newPw.length < 6) {
      alert("New password must be at least 6 characters.");
      return;
    }
    try {
      const r = await fetch("/api/me/password", {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ old_password: oldPw, new_password: newPw })
      });
      const d = await r.json();
      if (d.success) {
        alert("Password changed. Please log in again.");
        window.location.href = "/login";
      } else {
        alert(d.error || "Failed to change password.");
      }
    } catch {
      alert("Network error.");
    }
  });

  // -------------------------------------------------------------------------
  //  Search
  // -------------------------------------------------------------------------
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const raw = input.value.trim();

    const kind = detectType(raw);
    if (kind === "invalid") {
      setStatus("Enter a valid 13-digit CNIC or 11-digit mobile number.", "error");
      resultsEl.innerHTML = "";
      clearAutoNote();
      showToolbar(false);
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Searching...';
    setStatus(
      kind === "mobile"
        ? "Searching mobile... (may also auto-fetch all numbers by CNIC)"
        : "Querying server...",
      "info"
    );
    resultsEl.innerHTML = "";
    clearAutoNote();
    showToolbar(false);

    try {
      const res = await fetch("/api/search", {
        method: "POST",
        credentials: "include",
        headers: {
          "Content-Type": "application/json",
          "X-Fingerprint": FINGERPRINT
        },
        body: JSON.stringify({ query: raw })
      });

      const data = await res.json();

      if (data.quota) setQuota(data.quota);

      if (res.status === 429) {
        setStatus(escapeHtml(data.error || "Rate limit reached."), "error");
        refreshQuota();
        return;
      }

      if (res.status === 401) {
        setStatus("Session expired. Redirecting to login...", "error");
        setTimeout(() => window.location.href = "/login", 1200);
        return;
      }

      if (res.status === 403) {
        setStatus(escapeHtml(data.error || "Access denied."), "error");
        return;
      }

      if (!res.ok || !data.success) {
        setStatus(escapeHtml(data.error || `Request failed (${res.status})`), "error");
        return;
      }

      const badge = data.type === "cnic"
        ? '<span class="badge badge-cnic">CNIC</span>'
        : '<span class="badge badge-mobile">MOBILE</span>';

      if (data.count === 0) {
        setStatus(`No results found for this ${data.type.toUpperCase()}. ${badge}`, "error");
        return;
      }

      setStatus(
        `Found ${data.count} result(s) for <strong>${escapeHtml(data.query)}</strong> ${badge}`,
        "info"
      );

      const meta = data.meta || {};
      if (meta.auto_cnic_lookup && meta.auto_cnic) {
        setAutoNote(
          `ℹ️ Mobile lookup returned CNIC <strong>${escapeHtml(meta.auto_cnic)}</strong>. ` +
          `Auto-fetched <strong>${meta.second_lookup_count}</strong> number(s) against this CNIC.`
        );
      }

      renderResults(
        data.results,
        data.type === "mobile" ? data.query : "",
        data.query || raw
      );

    } catch (err) {
      setStatus("Network error: " + escapeHtml(err.message), "error");
    } finally {
      btn.disabled = false;
      btn.textContent = "Search";
    }
  });

  input.addEventListener("input", () => {
    input.value = input.value.replace(/[^\d+\-\s]/g, "");
  });

  // -------------------------------------------------------------------------
  //  Save as PDF
  // -------------------------------------------------------------------------
  downloadBtn.addEventListener("click", () => {
    const originalTitle = document.title;
    const safeQuery = CURRENT_QUERY.replace(/[^\w\-]/g, "_") || "results";
    document.title = `FreshSIM_${safeQuery}`;

    const printHeader = document.querySelector(".print-only");
    if (printHeader) printHeader.style.display = "block";

    setTimeout(() => {
      window.print();
      setTimeout(() => {
        document.title = originalTitle;
        if (printHeader) printHeader.style.display = "none";
      }, 500);
    }, 50);
  });
</script>
</body>
</html>
