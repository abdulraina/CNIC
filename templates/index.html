<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fresh SIM Tracker — CNIC & Mobile Lookup</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
    background: linear-gradient(135deg, #1e3a8a 0%, #4c1d95 100%);
    min-height: 100vh;
    color: #1f2937;
    padding: 24px;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    overflow: hidden;
  }
  .header {
    background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
    color: white;
    padding: 32px;
    text-align: center;
  }
  .header h1 { margin: 0 0 8px; font-size: 1.8rem; }
  .header p { margin: 0; opacity: 0.9; font-size: 0.95rem; }

  .form-wrap { padding: 28px 32px 8px; }
  .form-row { display: flex; gap: 12px; flex-wrap: wrap; }
  input[type="text"] {
    flex: 1;
    min-width: 240px;
    padding: 14px 16px;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    font-size: 1rem;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }
  input[type="text"]:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
  }
  button {
    padding: 14px 28px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
  }
  button:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }

  .hint { padding: 8px 32px 0; font-size: 0.82rem; color: #6b7280; }

  .status { padding: 16px 32px 0; font-size: 0.9rem; }
  .status.error { color: #b91c1c; }
  .status.info  { color: #1d4ed8; }

  .quota {
    margin: 12px 32px 0;
    padding: 8px 14px;
    background: #eef2ff;
    color: #3730a3;
    border-radius: 8px;
    font-size: 0.85rem;
    display: inline-block;
  }
  .quota.low { background: #fef2f2; color: #991b1b; }

  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    margin-left: 8px;
    vertical-align: middle;
  }
  .badge-cnic   { background: #dbeafe; color: #1e40af; }
  .badge-mobile { background: #dcfce7; color: #166534; }
  .badge-auto   { background: #fef3c7; color: #92400e; }

  .auto-note {
    margin: 12px 32px 0;
    padding: 10px 14px;
    border-left: 4px solid #f59e0b;
    background: #fffbeb;
    color: #78350f;
    font-size: 0.9rem;
    border-radius: 6px;
  }

  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: -3px;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .results { padding: 20px 32px 32px; }
  .card {
    border: 1px solid #e5e7eb;
    border-left: 4px solid #7c3aed;
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 14px;
    background: #fafafa;
    transition: box-shadow 0.2s;
  }
  .card:hover { box-shadow: 0 6px 18px rgba(0,0,0,0.08); }
  .card.primary { border-left-color: #059669; background: #f0fdf4; }
  .row {
    display: flex;
    padding: 6px 0;
    border-bottom: 1px dashed #eee;
    font-size: 0.95rem;
  }
  .row:last-child { border-bottom: none; }
  .label { width: 110px; font-weight: 600; color: #4b5563; flex-shrink: 0; }
  .value {
    color: #111827;
    word-break: break-word;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }
  .network-logo { height: 24px; width: auto; border-radius: 3px; vertical-align: middle; }

  @media (max-width: 600px) {
    .header { padding: 22px; }
    .header h1 { font-size: 1.4rem; }
    .form-wrap, .results, .status, .hint, .auto-note, .quota {
      padding-left: 18px; padding-right: 18px;
    }
    .auto-note, .quota { margin-left: 18px; margin-right: 18px; }
    .label { width: 90px; font-size: 0.9rem; }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📱 Fresh SIM Tracker</h1>
      <p>Search SIM details by CNIC or Mobile number</p>
    </div>

    <div class="form-wrap">
      <form id="searchForm" class="form-row">
        <input
          type="text"
          id="query"
          name="query"
          placeholder="Enter CNIC (13 digits) or Mobile (11 digits)"
          maxlength="20"
          autocomplete="off"
          required
        />
        <button type="submit" id="submitBtn">Search</button>
      </form>
    </div>
    <div class="hint">
      Examples: <strong>4530448083059</strong> (CNIC) &nbsp;•&nbsp;
      <strong>03001234567</strong> or <strong>+923001234567</strong> (Mobile)
    </div>

    <div id="quotaBox" class="quota" style="display:none;"></div>
    <div id="status" class="status"></div>
    <div id="autoNote"></div>
    <div id="results" class="results"></div>
  </div>

<script>
  // -------------------------------------------------------------------------
  //  Persistent client ID (device fingerprint component)
  // -------------------------------------------------------------------------
  const CLIENT_ID_KEY = "simtracker_client_id";

  function getClientId() {
    try {
      let id = localStorage.getItem(CLIENT_ID_KEY);
      if (!id) {
        const buf = new Uint8Array(16);
        crypto.getRandomValues(buf);
        id = Array.from(buf).map(b => b.toString(16).padStart(2, "0")).join("");
        localStorage.setItem(CLIENT_ID_KEY, id);
      }
      return id;
    } catch {
      return "anon-" + Math.random().toString(36).slice(2) + Date.now();
    }
  }

  const CLIENT_ID = getClientId();

  // -------------------------------------------------------------------------
  //  DOM
  // -------------------------------------------------------------------------
  const form      = document.getElementById("searchForm");
  const input     = document.getElementById("query");
  const btn       = document.getElementById("submitBtn");
  const statusEl  = document.getElementById("status");
  const autoNote  = document.getElementById("autoNote");
  const resultsEl = document.getElementById("results");
  const quotaBox  = document.getElementById("quotaBox");

  function setStatus(html, type = "") {
    statusEl.className = "status " + type;
    statusEl.innerHTML = html;
  }
  function clearAutoNote() { autoNote.innerHTML = ""; }
  function setAutoNote(html) {
    autoNote.innerHTML = `<div class="auto-note">${html}</div>`;
  }
  function escapeHtml(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function humanizeReset(seconds) {
    if (!seconds || seconds <= 0) return "soon";
    const mins = Math.ceil(seconds / 60);
    if (mins < 60) return `${mins} min`;
    const hours = Math.floor(mins / 60);
    const remMin = mins % 60;
    return remMin ? `${hours}h ${remMin}m` : `${hours}h`;
  }

  function setQuota(q) {
    if (!q) { quotaBox.style.display = "none"; return; }
    quotaBox.style.display = "inline-block";
    quotaBox.classList.toggle("low", q.remaining <= 2);
    quotaBox.textContent =
      `Searches remaining: ${q.remaining} / ${q.limit}` +
      (q.reset_in > 0 ? ` (resets in ~${humanizeReset(q.reset_in)})` : "");
  }

  function detectType(raw) {
    const digits = raw.replace(/\D/g, "");
    let stripped = digits;
    if (stripped.startsWith("0092")) stripped = stripped.slice(4);
    else if (stripped.startsWith("92") && stripped.length === 12) stripped = stripped.slice(2);

    if (digits.length === 13 && !digits.startsWith("0")) return "cnic";
    if (stripped.length === 11 && stripped.startsWith("03")) return "mobile";
    if (stripped.length === 10 && stripped.startsWith("3"))  return "mobile";
    return "invalid";
  }

  function renderResults(list, searchedMobile) {
    if (!list.length) { resultsEl.innerHTML = ""; return; }
    const normalize = s => String(s || "").replace(/\D/g, "");
    const searched = normalize(searchedMobile);

    resultsEl.innerHTML = list.map((r, i) => {
      const isPrimary = searched && normalize(r.mobile) === searched;

      let networkCell = "";
      if (r.network_image) {
        networkCell += `<img class="network-logo"
                            src="${escapeHtml(r.network_image)}"
                            alt="${escapeHtml(r.network || 'network')}"
                            onerror="this.style.display='none'" />`;
      }
      if (r.network && String(r.network).trim()) {
        networkCell += `<span>${escapeHtml(r.network)}</span>`;
      } else if (!r.network_image) {
        networkCell = "<span>—</span>";
      }

      return `
        <div class="card${isPrimary ? " primary" : ""}">
          <div class="row"><div class="label">#</div><div class="value">${i + 1}${isPrimary ? ' <span class="badge badge-auto">MATCH</span>' : ""}</div></div>
          <div class="row"><div class="label">Mobile</div><div class="value">${escapeHtml(r.mobile || "—")}</div></div>
          <div class="row"><div class="label">Name</div><div class="value">${escapeHtml(r.name || "—")}</div></div>
          <div class="row"><div class="label">CNIC</div><div class="value">${escapeHtml(r.cnic || "—")}</div></div>
          <div class="row"><div class="label">Address</div><div class="value">${escapeHtml(r.address || "—")}</div></div>
          <div class="row"><div class="label">Network</div><div class="value">${networkCell}</div></div>
        </div>
      `;
    }).join("");
  }

  // -------------------------------------------------------------------------
  //  Quota fetch on load
  // -------------------------------------------------------------------------
  async function refreshQuota() {
    try {
      const r = await fetch("/api/quota", {
        method: "GET",
        headers: { "X-Client-Id": CLIENT_ID }
      });
      if (!r.ok) return;
      const q = await r.json();
      if (q.success) setQuota(q);
    } catch { /* ignore */ }
  }

  refreshQuota();

  // -------------------------------------------------------------------------
  //  Search
  // -------------------------------------------------------------------------
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const raw = input.value.trim();

    const kind = detectType(raw);
    if (kind === "invalid") {
      setStatus("Enter a valid 13-digit CNIC or 11-digit mobile number.", "error");
      resultsEl.innerHTML = "";
      clearAutoNote();
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Searching...';
    setStatus(
      kind === "mobile"
        ? "Searching mobile... (may also auto-fetch all numbers by CNIC)"
        : "Querying server...",
      "info"
    );
    resultsEl.innerHTML = "";
    clearAutoNote();

    try {
      const res = await fetch("/api/search", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Client-Id": CLIENT_ID
        },
        body: JSON.stringify({ query: raw })
      });

      const data = await res.json();

      // Quota updates even on errors
      if (data.quota) setQuota(data.quota);

      if (res.status === 429) {
        setStatus(escapeHtml(data.error || "Rate limit reached."), "error");
        refreshQuota();
        return;
      }

      if (!res.ok || !data.success) {
        setStatus(escapeHtml(data.error || `Request failed (${res.status})`), "error");
        return;
      }

      const badge = data.type === "cnic"
        ? '<span class="badge badge-cnic">CNIC</span>'
        : '<span class="badge badge-mobile">MOBILE</span>';

      if (data.count === 0) {
        setStatus(`No results found for this ${data.type.toUpperCase()}. ${badge}`, "error");
        return;
      }

      setStatus(
        `Found ${data.count} result(s) for <strong>${escapeHtml(data.query)}</strong> ${badge}`,
        "info"
      );

      const meta = data.meta || {};
      if (meta.auto_cnic_lookup && meta.auto_cnic) {
        setAutoNote(
          `ℹ️ Mobile lookup returned CNIC <strong>${escapeHtml(meta.auto_cnic)}</strong>. ` +
          `Auto-fetched <strong>${meta.second_lookup_count}</strong> number(s) against this CNIC.`
        );
      }

      renderResults(data.results, data.type === "mobile" ? data.query : "");

    } catch (err) {
      setStatus("Network error: " + escapeHtml(err.message), "error");
    } finally {
      btn.disabled = false;
      btn.textContent = "Search";
    }
  });

  // Allow only digits, dashes, plus, and spaces
  input.addEventListener("input", () => {
    input.value = input.value.replace(/[^\d+\-\s]/g, "");
  });
</script>
</body>
</html>
