<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Panel — Fresh SIM Tracker</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    min-height: 100vh;
    color: #1f2937;
    padding: 24px;
  }
  .container {
    max-width: 1100px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    overflow: hidden;
  }
  .header {
    background: linear-gradient(135deg, #7c3aed 0%, #2563eb 100%);
    color: white;
    padding: 28px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .header h1 { margin: 0; font-size: 1.5rem; }
  .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .header-btn {
    padding: 9px 16px;
    background: rgba(255,255,255,0.15);
    color: white;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.2s;
  }
  .header-btn:hover { background: rgba(255,255,255,0.28); }

  .content { padding: 28px 32px 40px; }

  .panel {
    background: #fafafa;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 22px;
    margin-bottom: 22px;
  }
  .panel h2 {
    margin: 0 0 16px;
    font-size: 1.15rem;
    color: #1e40af;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px;
    align-items: end;
  }
  label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    color: #4b5563;
    margin-bottom: 6px;
  }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid #e5e7eb;
    border-radius: 8px;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input:focus {
    border-color: #7c3aed;
    box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
  }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-top: 24px;
  }
  .checkbox-row input { width: auto; }
  .checkbox-row label { margin: 0; font-weight: 500; }

  .btn {
    padding: 11px 22px;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
  }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-primary {
    background: linear-gradient(135deg, #7c3aed, #2563eb);
    color: white;
  }
  .btn-primary:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(124, 58, 237, 0.35);
  }
  .btn-sm {
    padding: 6px 12px;
    font-size: 0.78rem;
    border-radius: 6px;
  }
  .btn-outline {
    background: #ffffff;
    color: #1e40af;
    border: 1.5px solid #1e40af;
  }
  .btn-outline:hover:not(:disabled) { background: #eef2ff; }
  .btn-danger {
    background: #ffffff;
    color: #b91c1c;
    border: 1.5px solid #b91c1c;
  }
  .btn-danger:hover:not(:disabled) { background: #fef2f2; }
  .btn-warn {
    background: #ffffff;
    color: #b45309;
    border: 1.5px solid #b45309;
  }
  .btn-warn:hover:not(:disabled) { background: #fffbeb; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }
  th, td {
    padding: 12px 10px;
    text-align: left;
    border-bottom: 1px solid #e5e7eb;
  }
  th {
    background: #f3f4f6;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #6b7280;
    font-weight: 700;
  }
  tr:hover td { background: #fafafa; }
  .badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 700;
  }
  .badge-admin  { background: #ede9fe; color: #6d28d9; }
  .badge-user   { background: #dbeafe; color: #1e40af; }
  .badge-active { background: #dcfce7; color: #166534; }
  .badge-off    { background: #fee2e2; color: #991b1b; }
  .actions-cell { display: flex; gap: 6px; flex-wrap: wrap; }

  .msg {
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 0.88rem;
    margin-bottom: 16px;
    display: none;
  }
  .msg.show { display: block; }
  .msg-ok    { background: #f0fdf4; color: #166534; border: 1px solid #86efac; }
  .msg-err   { background: #fef2f2; color: #991b1b; border: 1px solid #fca5a5; }

  .empty { text-align: center; color: #9ca3af; padding: 24px; font-size: 0.9rem; }

  @media (max-width: 700px) {
    .content { padding: 20px 16px 30px; }
    .header { padding: 20px; }
    .header h1 { font-size: 1.2rem; }
    th, td { font-size: 0.8rem; padding: 8px 6px; }
    .actions-cell { flex-direction: column; }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>⚙️ Admin Panel</h1>
      <div class="header-actions">
        <a href="/app" class="header-btn">📱 SIM Tracker</a>
        <button class="header-btn" id="logoutBtn" type="button">Logout</button>
      </div>
    </div>

    <div class="content">
      <div id="msg" class="msg"></div>

      <!-- Create User -->
      <div class="panel">
        <h2>➕ Create New User</h2>
        <form id="createForm" class="form-grid">
          <div>
            <label for="newUsername">Username</label>
            <input type="text" id="newUsername" placeholder="e.g. operator1"
                   maxlength="64" required autocomplete="off" />
          </div>
          <div>
            <label for="newPassword">Password</label>
            <input type="password" id="newPassword" placeholder="Min 6 characters"
                   maxlength="128" required autocomplete="new-password" />
          </div>
          <div class="checkbox-row">
            <input type="checkbox" id="newIsAdmin" />
            <label for="newIsAdmin">Grant admin privileges</label>
          </div>
          <div>
            <button type="submit" class="btn btn-primary" id="createBtn" style="width:100%;">Create User</button>
          </div>
        </form>
      </div>

      <!-- Users list -->
      <div class="panel">
        <h2>👥 Users <span style="font-size:0.85rem;font-weight:500;color:#6b7280;">(<span id="userCount">0</span>)</span></h2>
        <div style="overflow-x:auto;">
          <table id="usersTable">
            <thead>
              <tr>
                <th>Username</th>
                <th>Role</th>
                <th>Status</th>
                <th>Last Login</th>
                <th>Searches</th>
                <th>Created</th>
                <th style="min-width:260px;">Actions</th>
              </tr>
            </thead>
            <tbody id="usersBody">
              <tr><td colspan="7" class="empty">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

<script>
  const msgEl    = document.getElementById("msg");
  const usersBody = document.getElementById("usersBody");
  const userCount = document.getElementById("userCount");
  const createForm = document.getElementById("createForm");
  const createBtn = document.getElementById("createBtn");

  function showMsg(text, type = "ok") {
    msgEl.textContent = text;
    msgEl.className = `msg show msg-${type}`;
    setTimeout(() => msgEl.classList.remove("show"), 4000);
  }

  function fmtDate(ts) {
    if (!ts) return "—";
    return new Date(ts * 1000).toLocaleString();
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  async function loadUsers() {
    try {
      const r = await fetch("/api/admin/users", { credentials: "include" });
      if (r.status === 401) { window.location.href = "/login"; return; }
      if (r.status === 403) { window.location.href = "/app"; return; }
      const d = await r.json();
      if (!d.success) {
        usersBody.innerHTML = '<tr><td colspan="7" class="empty">Failed to load users.</td></tr>';
        return;
      }
      renderUsers(d.users);
    } catch {
      usersBody.innerHTML = '<tr><td colspan="7" class="empty">Network error.</td></tr>';
    }
  }

  function renderUsers(users) {
    userCount.textContent = users.length;
    if (!users.length) {
      usersBody.innerHTML = '<tr><td colspan="7" class="empty">No users yet.</td></tr>';
      return;
    }
    usersBody.innerHTML = users.map(u => `
      <tr>
        <td><strong>${esc(u.username)}</strong></td>
        <td>${u.is_admin
              ? '<span class="badge badge-admin">ADMIN</span>'
              : '<span class="badge badge-user">USER</span>'}</td>
        <td>${u.is_active
              ? '<span class="badge badge-active">Active</span>'
              : '<span class="badge badge-off">Disabled</span>'}</td>
        <td>${esc(fmtDate(u.last_login))}</td>
        <td>${u.search_count || 0}</td>
        <td>${esc(fmtDate(u.created_at))}</td>
        <td>
          <div class="actions-cell">
            <button class="btn btn-sm btn-outline" data-act="pw" data-user="${esc(u.username)}">🔑 Password</button>
            <button class="btn btn-sm ${u.is_active ? 'btn-warn' : 'btn-outline'}"
                    data-act="toggle" data-user="${esc(u.username)}">
              ${u.is_active ? '🚫 Disable' : '✅ Enable'}
            </button>
            <button class="btn btn-sm btn-outline" data-act="revoke" data-user="${esc(u.username)}">🔒 Revoke</button>
            <button class="btn btn-sm btn-danger" data-act="del" data-user="${esc(u.username)}">🗑 Delete</button>
          </div>
        </td>
      </tr>
    `).join("");
  }

  // Delegate actions
  usersBody.addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    const action = btn.dataset.act;
    const username = btn.dataset.user;

    if (action === "pw") {
      const newPw = prompt(`Enter NEW password for "${username}" (min 6 chars):`);
      if (!newPw) return;
      if (newPw.length < 6) { showMsg("Password must be at least 6 characters.", "err"); return; }
      const r = await fetch(`/api/admin/users/${encodeURIComponent(username)}/password`, {
        method: "POST", credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ new_password: newPw })
      });
      const d = await r.json();
      showMsg(d.success ? d.message : (d.error || "Failed"), d.success ? "ok" : "err");
      if (d.success) loadUsers();
    }

    if (action === "toggle") {
      if (!confirm(`Toggle active state for "${username}"?`)) return;
      const r = await fetch(`/api/admin/users/${encodeURIComponent(username)}/toggle`, {
        method: "POST", credentials: "include"
      });
      const d = await r.json();
      showMsg(d.success ? d.message : (d.error || "Failed"), d.success ? "ok" : "err");
      if (d.success) loadUsers();
    }

    if (action === "revoke") {
      if (!confirm(`Revoke all sessions for "${username}"? They will need to log in again.`)) return;
      const r = await fetch(`/api/admin/users/${encodeURIComponent(username)}/revoke`, {
        method: "POST", credentials: "include"
      });
      const d = await r.json();
      showMsg(d.success ? d.message : (d.error || "Failed"), d.success ? "ok" : "err");
    }

    if (action === "del") {
      if (!confirm(`Delete user "${username}" permanently? This cannot be undone.`)) return;
      const r = await fetch(`/api/admin/users/${encodeURIComponent(username)}`, {
        method: "DELETE", credentials: "include"
      });
      const d = await r.json();
      showMsg(d.success ? d.message : (d.error || "Failed"), d.success ? "ok" : "err");
      if (d.success) loadUsers();
    }
  });

  // Create user
  createForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const username = document.getElementById("newUsername").value.trim();
    const password = document.getElementById("newPassword").value;
    const is_admin = document.getElementById("newIsAdmin").checked;

    if (!username || username.length < 3) { showMsg("Username must be at least 3 characters.", "err"); return; }
    if (!password || password.length < 6)   { showMsg("Password must be at least 6 characters.", "err"); return; }

    createBtn.disabled = true;
    createBtn.textContent = "Creating...";

    try {
      const r = await fetch("/api/admin/users", {
        method: "POST", credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password, is_admin })
      });
      const d = await r.json();
      showMsg(d.success ? d.message : (d.error || "Failed"), d.success ? "ok" : "err");
      if (d.success) {
        createForm.reset();
        loadUsers();
      }
    } catch {
      showMsg("Network error.", "err");
    } finally {
      createBtn.disabled = false;
      createBtn.textContent = "Create User";
    }
  });

  // Logout
  document.getElementById("logoutBtn").addEventListener("click", async () => {
    try { await fetch("/api/logout", { method: "POST", credentials: "include" }); } catch {}
    window.location.href = "/login";
  });

  loadUsers();
</script>
</body>
</html>
