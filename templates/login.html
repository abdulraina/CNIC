<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Login — Fresh SIM Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #e2e8f0;
    }
    .login-container {
      width: 100%;
      max-width: 420px;
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 24px;
      padding: 48px 40px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255,255,255,0.03) inset;
    }
    .lock-icon {
      width: 64px; height: 64px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.4);
    }
    .lock-icon svg {
      width: 32px; height: 32px;
      stroke: white; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    h1 {
      font-size: 1.75rem; font-weight: 700; text-align: center; margin-bottom: 8px;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle { text-align: center; font-size: 0.9rem; color: #94a3b8; margin-bottom: 36px; }
    .form-group { margin-bottom: 22px; position: relative; }
    .form-group label {
      display: block; font-size: 0.85rem; font-weight: 600;
      color: #cbd5e1; margin-bottom: 8px; letter-spacing: 0.02em;
    }
    .form-group input {
      width: 100%; padding: 14px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1.5px solid rgba(148, 163, 184, 0.2);
      border-radius: 12px; font-size: 1rem; color: #f1f5f9; outline: none;
      transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
    }
    .form-group input::placeholder { color: #64748b; }
    .form-group input:focus {
      border-color: #3b82f6; background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
    }
    .form-group input.error {
      border-color: #ef4444; box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.15);
      animation: shake 0.4s ease;
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }
    .password-wrapper { position: relative; }
    .toggle-password {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; padding: 4px;
      color: #64748b; transition: color 0.2s; display: flex; align-items: center;
    }
    .toggle-password:hover { color: #94a3b8; }
    .toggle-password svg {
      width: 20px; height: 20px; fill: none; stroke: currentColor;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .btn-login {
      width: 100%; padding: 15px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white; border: none; border-radius: 12px;
      font-size: 1rem; font-weight: 700; letter-spacing: 0.03em;
      cursor: pointer; transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    }
    .btn-login:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(59, 130, 246, 0.4);
    }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-login .spinner {
      display: inline-block; width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,0.3); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.7s linear infinite;
      vertical-align: -4px; margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-message, .lockout-message {
      display: none; margin-top: 18px; padding: 12px 16px; border-radius: 10px;
      font-size: 0.875rem; text-align: center; animation: fadeIn 0.3s ease;
    }
    .error-message {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5;
    }
    .lockout-message {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3); color: #fcd34d;
    }
    .error-message.show, .lockout-message.show { display: block; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .security-note {
      margin-top: 28px; padding-top: 20px;
      border-top: 1px solid rgba(148, 163, 184, 0.1);
      display: flex; align-items: center; justify-content: center;
      gap: 8px; font-size: 0.78rem; color: #64748b;
    }
    .security-note svg { width: 14px; height: 14px; stroke: #64748b; fill: none; stroke-width: 2; }
    @media (max-width: 480px) {
      .login-container { padding: 36px 24px; border-radius: 20px; }
      h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="lock-icon">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <h1>Secure Access</h1>
    <p class="subtitle">Fresh SIM Tracker — Authorized Personnel Only</p>

    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter your username"
               maxlength="64" autocomplete="username" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" name="password" placeholder="Enter your password"
                 maxlength="128" autocomplete="current-password" required />
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
            <svg id="eyeIcon" viewBox="0 0 24 24">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">Sign In</button>

      <div class="error-message" id="errorMsg"></div>
      <div class="lockout-message" id="lockoutMsg"></div>
    </form>

    <div class="security-note">
      <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span>End-to-end encrypted • Session protected</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      const form       = document.getElementById("loginForm");
      const usernameEl = document.getElementById("username");
      const passwordEl = document.getElementById("password");
      const loginBtn   = document.getElementById("loginBtn");
      const errorMsg   = document.getElementById("errorMsg");
      const lockoutMsg = document.getElementById("lockoutMsg");
      const toggleBtn  = document.getElementById("togglePassword");
      const eyeIcon    = document.getElementById("eyeIcon");

      const MAX_ATTEMPTS = 5;
      const LOCKOUT_MS   = 5 * 60 * 1000;
      const STORAGE_KEY  = "rnx_login_attempts";

      function getAttemptData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return { count: 0, lockedUntil: 0 };
          const d = JSON.parse(raw);
          return (typeof d.count === "number" && typeof d.lockedUntil === "number")
            ? d : { count: 0, lockedUntil: 0 };
        } catch { return { count: 0, lockedUntil: 0 }; }
      }
      function saveAttemptData(d) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch {}
      }
      function resetAttempts() {
        try { localStorage.removeItem(STORAGE_KEY); } catch {}
      }
      function isLockedOut() {
        const d = getAttemptData();
        if (d.lockedUntil && Date.now() < d.lockedUntil) return true;
        if (d.lockedUntil && Date.now() >= d.lockedUntil) { resetAttempts(); return false; }
        return false;
      }
      function recordFailedAttempt() {
        const d = getAttemptData();
        d.count = (d.count || 0) + 1;
        if (d.count >= MAX_ATTEMPTS) d.lockedUntil = Date.now() + LOCKOUT_MS;
        saveAttemptData(d);
      }
      function updateLockoutUI() {
        const d = getAttemptData();
        if (d.lockedUntil && Date.now() < d.lockedUntil) {
          const secs = Math.ceil((d.lockedUntil - Date.now()) / 1000);
          const m = Math.floor(secs / 60), s = secs % 60;
          lockoutMsg.textContent = `Too many failed attempts. Try again in ${m}m ${s}s.`;
          lockoutMsg.classList.add("show");
          loginBtn.disabled = usernameEl.disabled = passwordEl.disabled = true;
          return true;
        }
        lockoutMsg.classList.remove("show");
        loginBtn.disabled = usernameEl.disabled = passwordEl.disabled = false;
        return false;
      }

      let lockoutTimer = null;
      function startLockoutCountdown() {
        if (lockoutTimer) clearInterval(lockoutTimer);
        lockoutTimer = setInterval(() => {
          if (!updateLockoutUI()) {
            clearInterval(lockoutTimer);
            lockoutTimer = null;
            resetAttempts();
          }
        }, 1000);
      }

      if (isLockedOut()) { updateLockoutUI(); startLockoutCountdown(); }

      toggleBtn.addEventListener("click", () => {
        const isPw = passwordEl.type === "password";
        passwordEl.type = isPw ? "text" : "password";
        eyeIcon.innerHTML = isPw
          ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'
          : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      });

      usernameEl.addEventListener("input", function() {
        this.value = this.value.replace(/[^\w.\-@]/g, "");
      });

      function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.classList.add("show");
        usernameEl.classList.add("error");
        passwordEl.classList.add("error");
        setTimeout(() => {
          usernameEl.classList.remove("error");
          passwordEl.classList.remove("error");
        }, 500);
      }
      function clearError() {
        errorMsg.classList.remove("show");
        usernameEl.classList.remove("error");
        passwordEl.classList.remove("error");
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        clearError();

        if (isLockedOut()) { updateLockoutUI(); startLockoutCountdown(); return; }

        const username = usernameEl.value.trim();
        const password = passwordEl.value;

        if (!username || username.length < 3) { showError("Username must be at least 3 characters."); return; }
        if (!password || password.length < 6)   { showError("Password must be at least 6 characters."); return; }

        loginBtn.disabled = true;
        loginBtn.innerHTML = '<span class="spinner"></span>Authenticating...';
        usernameEl.disabled = passwordEl.disabled = true;

        try {
          const res = await fetch("/api/login", {
            method: "POST",
            credentials: "include",
            headers: {
              "Content-Type": "application/json",
              "X-Requested-With": "XMLHttpRequest"
            },
            body: JSON.stringify({ username, password })
          });

          const data = await res.json().catch(() => ({}));

          if (res.ok && data.success) {
            resetAttempts();
            loginBtn.innerHTML = "✓ Redirecting...";
            window.location.href = data.redirect || "/app";
            return;
          }

          recordFailedAttempt();
          const remaining = MAX_ATTEMPTS - getAttemptData().count;
          if (remaining > 0) {
            showError(data.error || `Invalid credentials. ${remaining} attempt(s) remaining.`);
          } else {
            showError("Account temporarily locked.");
            updateLockoutUI();
            startLockoutCountdown();
          }
        } catch (err) {
          showError("Network error. Please check your connection.");
        } finally {
          if (!isLockedOut()) {
            loginBtn.disabled = false;
            loginBtn.textContent = "Sign In";
            usernameEl.disabled = passwordEl.disabled = false;
          }
        }
      });

      window.addEventListener("load", () => {
        if (!isLockedOut()) usernameEl.focus();
      });
    })();
  </script>
</body>
</html>
